name: CI Build and Deploy to Render Cloud

on:
  push:
    branches: [ "main" ]
    
permissions:
  contents: read

jobs:
  lint:
    name: Lint Code via Ruff
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
            python-version: "3.13"
            cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Check code via Ruff
        run: ruff check .

      - name: Code formatting via Ruff
        run: ruff format --check .

      
  build:
    name: Build the Docker Image
    needs: lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v7

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag dicebootcamp26-assignment3:$(date +%s)

    - name: Push the Docker Image
      run: docker push dicebootcamp26-assignment3:$(date +%s)
