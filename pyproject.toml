[project]
name = "dicebootcamp26-assignment3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ali Arif", email = "highspeedali@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bandit>=1.9.4",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pytest.coverage.paths]
source = ["app"]

[tool.pytest.coverage.run]
branch = true
omit = ["tests/*"]
